databases:
  - name: ic-group-db
    databaseName: ic_group
    user: ic_group
    plan: free

services:
  - type: web
    name: ic-group-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ic-group-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
